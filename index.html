<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f2ed">
  <title>Mi Espacio</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f2ed;
      color: #42413e;
    }

    header {
      padding: 35px 20px;
      text-align: center;
      background: #e8e1d8;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 3px;
      font-weight: 400;
    }

    header p { color: #77716a; }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 20px;
    }

    button {
      border: 0;
      border-radius: 20px;
      padding: 12px 18px;
      background: #fff;
      color: #555;
      cursor: pointer;
      font-size: 14px;
    }

    button.active {
      background: #a9b7a5;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 25px;
    }

    section, .login-box {
      background: white;
      padding: 30px;
      border-radius: 16px;
      min-height: 220px;
      box-shadow: 0 3px 15px #00000008;
    }

    section h2 { font-weight: 400; }

    .muted { color: #888; }

    .login-box {
      max-width: 420px;
      min-height: auto;
      margin: 50px auto;
    }

    .login-box h2 {
      font-weight: 400;
      text-align: center;
    }

    .login-box label {
      display: block;
      margin: 18px 0 7px;
      color: #666;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .login-box button {
      width: 100%;
      margin-top: 22px;
      background: #a9b7a5;
      color: white;
    }

    #message {
      color: #a34c4c;
      font-size: 14px;
      margin-top: 15px;
      text-align: center;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      padding: 12px 20px 0;
    }

    .logout {
      background: #e8e1d8;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>

  <header>
    <h1>MI ESPACIO</h1>
    <p>Un lugar para organizar mi vida</p>
  </header>

  <!-- INICIO DE SESIÓN -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>Bienvenida</h2>
      <p class="muted" style="text-align:center">
        Accede a tu espacio personal
      </p>

      <form id="loginForm">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="loginButton" type="submit">
          Entrar
        </button>
      </form>

      <p id="message"></p>
    </div>
  </div>

  <!-- APLICACIÓN -->
  <div id="appScreen" hidden>

    <div class="top-bar">
      <button class="logout" onclick="logout()">
        Cerrar sesión
      </button>
    </div>

    <nav id="navigation">
      <button data-section="entrenamientos"
        onclick="showSection('entrenamientos', this)">
        Entrenamientos
      </button>

      <button data-section="dia"
        onclick="showSection('dia', this)">
        Mi día a día
      </button>

      <button data-section="amaia"
        onclick="showSection('amaia', this)">
        Amaia
      </button>

      <button data-section="economia"
        onclick="showSection('economia', this)">
        Mi economía
      </button>
    </nav>

    <main>
      <section id="content"></section>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://xsnctynrjamnaatrtiir.supabase.co";

    const SUPABASE_KEY =
      "PEGA_AQUI_TU_CLAVE_PUBLICABLE";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const sections = {
      entrenamientos: [
        "Entrenamientos",
        "Aquí organizaremos tus entrenamientos y progresos."
      ],
      dia: [
        "Mi día a día",
        "Aquí organizaremos tus tareas y asuntos personales."
      ],
      amaia: [
        "Amaia – Estudios y organización",
        "Aquí organizaremos sus estudios y tareas."
      ],
      economia: [
        "Mi economía",
        "Aquí organizaremos tus ingresos y gastos."
      ]
    };

    let currentRole = null;

    const loginScreen = document.getElementById("loginScreen");
    const appScreen = document.getElementById("appScreen");
    const message = document.getElementById("message");

    function showLogin(error = "") {
      appScreen.hidden = true;
      loginScreen.hidden = false;
      message.textContent = error;
    }

    function showApp(role) {
      currentRole = role;
      loginScreen.hidden = true;
      appScreen.hidden = false;

      const buttons = document.querySelectorAll("#navigation button");

      buttons.forEach(button => {
        button.hidden =
          role !== "owner" &&
          button.dataset.section !== "amaia";
      });

      if (role === "owner") {
        const firstButton =
          document.querySelector('[data-section="entrenamientos"]');

        showSection("entrenamientos", firstButton);
      } else {
        const amaiaButton =
          document.querySelector('[data-section="amaia"]');

        showSection("amaia", amaiaButton);
      }
    }

    function showSection(name, button) {
      if (currentRole !== "owner" && name !== "amaia") {
        return;
      }

      const content = document.getElementById("content");

      const heading = document.createElement("h2");
      heading.textContent = sections[name][0];

      const paragraph = document.createElement("p");
      paragraph.className = "muted";
      paragraph.textContent = sections[name][1];

      content.replaceChildren(heading, paragraph);

      document.querySelectorAll("#navigation button")
        .forEach(b => b.classList.remove("active"));

      button.classList.add("active");
    }

    async function loadProfile(user) {
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

      if (error || !data) {
        await supabaseClient.auth.signOut();
        showLogin("No se ha podido cargar tu perfil.");
        return;
      }

      if (data.role !== "owner" && data.role !== "amaia") {
        await supabaseClient.auth.signOut();
        showLogin("Tu cuenta no tiene un perfil autorizado.");
        return;
      }

      showApp(data.role);
    }

    document.getElementById("loginForm")
      .addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const loginButton = document.getElementById("loginButton");

        loginButton.disabled = true;
        loginButton.textContent = "Entrando...";
        message.textContent = "";

        const { data, error } = await supabaseClient.auth
          .signInWithPassword({ email, password });

        loginButton.disabled = false;
        loginButton.textContent = "Entrar";

        if (error) {
          message.textContent =
            "No se ha podido iniciar sesión. Comprueba el correo y la contraseña.";
          return;
        }

        await loadProfile(data.user);
      });

    async function logout() {
      await supabaseClient.auth.signOut();
      currentRole = null;
      showLogin();
    }

    async function init() {
      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        showLogin("No se ha podido comprobar la sesión.");
        return;
      }

      if (data.session) {
        await loadProfile(data.session.user);
      } else {
        showLogin();
      }
    }

    init();
  </script>

</body>
</html>
